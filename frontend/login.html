<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · WealthPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand-row">
        <div class="brand-mark">W</div>
        <div>
          <div class="brand-title">WealthPulse</div>
          <div class="brand-subtitle">Habit & Wealth Intelligence</div>
        </div>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Enter your credentials to access your financial dashboard.</p>

      <div id="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" data-testid="login-email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password" data-testid="login-password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-testid="login-submit">Sign In to Dashboard →</button>
      </form>

      <div class="small-link">
        Don't have an account? <a href="/register.html" data-testid="register-link">Create one for free</a>
      </div>
      <div class="small-link" style="margin-top: 6px;">
        <a href="/" style="color: var(--text-muted);">← Return to homepage</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (Auth.token) {
      window.location.href = Auth.user && Auth.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        Auth.set(data.token, data.user);
        window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error" data-testid="login-error">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
